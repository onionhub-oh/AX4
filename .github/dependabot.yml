version: 2
updates:
  - package-ecosystem: npm
    directory: /ax4
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      ax4-runtime:
        patterns: ["next", "react", "react-dom", "@supabase/*", "openai"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
